name: Playwright Tests

on:
  workflow_dispatch:

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      PRACTICE_QA_EMAIL: ${{ secrets.PRACTICE_QA_EMAIL }}
      PRACTICE_QA_PASSWORD: ${{ secrets.PRACTICE_QA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=practiceQA --project=practiceQA-setup --project=practiceQA-authenticated --reporter=html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces
          path: artifacts/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 30