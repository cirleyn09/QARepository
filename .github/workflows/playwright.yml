name: Playwright Tests

on:
  workflow_dispatch:

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PRACTICE_QA_EMAIL: ${{ secrets.PRACTICE_QA_EMAIL }}
      PRACTICE_QA_PASSWORD: ${{ secrets.PRACTICE_QA_PASSWORD }}
      PRACTICE_QA_BASE_URL: ${{ vars.PRACTICE_QA_BASE_URL || 'https://fullstack.qa-practice.dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=practiceQA --project=practiceQA-setup --project=practiceQA-authenticated --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
