name: Portfolio Tests

on:
  workflow_dispatch:

  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      PRACTICE_QA_EMAIL: ${{ secrets.PRACTICE_QA_EMAIL }}
      PRACTICE_QA_PASSWORD: ${{ secrets.PRACTICE_QA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: >
          npx playwright test
          --project=practiceQA
          --project=practiceQA-authenticated

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/playwright-report/
          retention-days: 30

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces
          path: artifacts/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: videos
          path: artifacts/test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 30


  postman-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman API tests
        run: >
          newman run
          "projects/practiceQA/postman/collections/PracticeQA - API Testing.postman_collection.json"
          -e "projects/practiceQA/postman/environments/PracticeQA Environment.postman_environment.json"
          --reporters cli,htmlextra
          --reporter-htmlextra-export artifacts/postman/report.html

      - name: Upload Postman HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: postman-html-report
          path: artifacts/postman/report.html
          if-no-files-found: ignore
          retention-days: 30